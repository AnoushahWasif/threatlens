[project]
name = "threatlens-api"
version = "0.1.0"
description = "ThreatLens API and scan worker"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "boto3>=1.43,<2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mangum>=0.22,<0.23",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "moto[dynamodb]>=5.2,<6",
    "pytest>=8.3",
    "ruff>=0.7",
    "uvicorn>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threatlens_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: tests use fake tokens and claim values like token_use="id", not passwords.
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
