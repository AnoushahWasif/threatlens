[project]
name = "threatlens-api"
version = "0.1.0"
description = "ThreatLens API and scan worker"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threatlens_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# S105: tests compare fake tokens like "p2", not passwords.
"tests/*" = ["S101", "S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
