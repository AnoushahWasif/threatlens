name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # The same API tests against the real DynamoDB engine, not the moto fake: condition
  # expressions, transactions and reserved words behave exactly as in AWS.
  api-dynamodb:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    env:
      THREATLENS_TEST_DYNAMODB_URL: http://localhost:8000
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync
      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          exit 1
      - run: uv run pytest

  # Builds the Lambda zip and runs it in AWS's own Lambda Python image, so a wheel built for
  # the wrong platform fails here and not after a deploy.
  lambda-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv run python scripts/package_lambda.py
        working-directory: apps/api
      - name: Smoke test in the Lambda Python 3.12 image
        run: |
          mkdir -p /tmp/task
          unzip -q apps/api/build/api.zip -d /tmp/task
          cp apps/api/scripts/lambda_smoke.py /tmp/smoke.py
          docker run --rm             -v /tmp/task:/var/task:ro -v /tmp/smoke.py:/smoke.py:ro             -e PYTHONPATH=/var/task -e THREATLENS_ENVIRONMENT=test             --entrypoint /var/lang/bin/python3             public.ecr.aws/lambda/python:3.12 /smoke.py

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      # Offline only: no AWS credentials exist in CI, so nothing can be planned or applied.
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.64.0
      - run: tflint --init
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: tflint --recursive --config "$PWD/.tflint.hcl"
        working-directory: infra
      - name: Trivy misconfiguration scan
        run: >-
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.75.0
          config --exit-code 1 --ignorefile .trivyignore.yaml --skip-dirs infra/.terraform infra
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node --test "infra/**/*.test.mjs"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Code patterns: injection, unsafe deserialising, XSS sinks, shell injection in workflows.
  # Rule packs come from the Semgrep registry; no account, and our code isn't uploaded.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Semgrep
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.183.0
          semgrep scan --error --metrics=off
          --config p/python --config p/typescript --config p/react
          --config p/owasp-top-ten --config p/github-actions

  # Known vulnerabilities in both lockfiles, dev tools included (they run here and on
  # laptops). Fails on MEDIUM or worse once a fixed version exists; Dependabot raises the
  # upgrade. Then writes ThreatLens's own SBOM and runs ThreatLens's parser on it.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Trivy vulnerability scan
        run: >-
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.75.0
          fs --scanners vuln --include-dev-deps --ignore-unfixed
          --severity MEDIUM,HIGH,CRITICAL --exit-code 1 .
      - name: SBOM of what ships (no dev tools)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.75.0
          fs --format cyclonedx --output threatlens.cdx.json .
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv run python scripts/check_own_sbom.py ../../threatlens.cdx.json
        working-directory: apps/api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: threatlens-sbom
          path: threatlens.cdx.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
